name: myapp
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.4+5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_auth: ^5.6.2
  firebase_core: ^3.15.1
  firebase_storage: ^12.4.9
  animated_snack_bar: ^0.4.0
  intl: any
  cloud_firestore: ^5.6.11
  get: ^4.6.5
  modal_bottom_sheet: ^3.0.0-pre
  rut_utils: ^0.1.2
  spelling_number: ^0.0.4
  dropdown_button2: ^2.3.9
  flutter_holo_date_picker: ^2.0.0
  responsive_grid_list: ^1.4.0
  group_button: ^5.3.3
  pdf: ^3.10.4
  printing: ^5.14.2
  permission_handler: ^11.3.1
  path_provider: ^2.1.5
  google_fonts: ^8.0.2
  image_picker: ^1.1.2
  image_editor_plus: ^1.0.4
  image_cropper: ^9.1.0
  google_mlkit_document_scanner: ^0.4.0
  date_picker_timeline: ^1.2.3
  share_plus: ^10.0.2
  file_saver: ^0.2.12
  open_filex: ^4.5.0
  calendar_date_picker2: ^1.1.0
  dio: ^5.8.0
  package_info_plus: ^8.1.3
  shared_preferences: ^2.5.3

  # Se importaban sin declararse y funcionaban por llegar de forma transitiva.
  # El dia que otra dependencia subiera de version mayor, la compilacion se
  # rompia sin que nadie hubiera tocado esos archivos.
  #   path -> lib/views/attendance/attendance_page.dart
  #   http -> lib/views/pictures/pictures_page.dart
  path: ^1.9.1
  http: ^1.6.0

  # Dependencia oficial de localizaciones (del SDK)
  flutter_localizations:
    sdk: flutter
  scrollable_positioned_list: ^0.3.8
  csv: ^6.0.0
  archive: ^4.0.9
  fl_chart: 0.68.0
  flutter_quill: ^11.5.0
  cloud_functions: ^5.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

dependency_overrides:
  screenshot: ^3.0.0 # Force screenshot to version 3.0.0 or higher

  # `flutter_quill` arrastra `quill_native_bridge_windows`, que usa
  # `GMEM_MOVEABLE` -- una constante que win32 recien agrego despues de la
  # 5.5.4 que resolvia el proyecto. El paquete es solo de Windows, pero el
  # compilador de Dart lo alcanza igual y el build de ANDROID fallaba con
  # "The getter 'GMEM_MOVEABLE' isn't defined".
  win32: ^5.14.0

flutter:
  uses-material-design: true
  
  assets:
    - lib/images/

  fonts:
    - family: Calibri
      fonts:
        - asset: lib/images/Calibri Regular.ttf
    - family: Calibri Bold
      fonts:
        - asset: lib/images/Calibri Bold.ttf
    - family: Cambria
      fonts:
        - asset: lib/images/Cambria.ttf